# AI Revenue Recovery — Alertmanager routing (s-34).
#
# Routing mirrors the severity vocabulary in infra/prometheus/rules.yml:
#   page   → paging target (staging drill webhook until prod on-call opts in)
#   ticket → ticket queue + #revenue-ops slack (next-business-day OK)
#   warn   → #revenue-ops slack, business hours
# Staging-first policy: all pages land on the STAGING paging drill receiver
# until the drill log (docs/runbooks/firing-drill.md) records three clean
# top-3 page deliveries; only then is the prod receiver swapped in via env.
# No secrets live here — receiver URLs come from environment / secret manager
# (CONVENTIONS §12); this file holds only routing shape.

global:
  resolve_timeout: 10m

templates: []

route:
  receiver: "slack-warn"
  group_by: ["alertname", "team"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = "page"
      receiver: "paging-staging"
      continue: true
    - matchers:
        - severity = "page"
      receiver: "slack-warn"
    - matchers:
        - severity = "ticket"
      receiver: "ticket-and-slack"

receivers:
  # Staging paging drill target. Operator replaces `webhook_url` with the
  # real paging integration when promoting to prod (docs/deploy/environments.md).
  - name: "paging-staging"
    webhook_configs:
      - url: "http://paging-drill:5001/page"
        send_resolved: true

  - name: "slack-warn"
    slack_configs:
      - channel: "#revenue-ops"
        api_url: "http://slack-bridge:5002/hook"
        send_resolved: true
        title: "{{ .GroupLabels.alertname }} ({{ .Status }})"
        text: "{{ range .Alerts }}{{ .Annotations.summary }} — {{ .Annotations.runbook_url }}\n{{ end }}"

  - name: "ticket-and-slack"
    webhook_configs:
      - url: "http://ticket-queue:5003/ticket"
        send_resolved: true
    slack_configs:
      - channel: "#revenue-ops"
        api_url: "http://slack-bridge:5002/hook"
        send_resolved: true
        title: "{{ .GroupLabels.alertname }} ({{ .Status }})"
        text: "{{ range .Alerts }}{{ .Annotations.summary }} — {{ .Annotations.runbook_url }}\n{{ end }}"

inhibit_rules:
  # A halted pipeline explains everything downstream — keep the page storm down.
  - source_matchers:
      - alertname = "MonitoringPipelineDown"
    target_matchers:
      - severity = "warn"
    equal: ["team"]
