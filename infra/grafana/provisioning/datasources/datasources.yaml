apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 5s
    editable: false

  # TODO s-34 placeholder (s-08 audit G-08-1): no `tempo` service exists in
  # infra/docker/docker-compose.yml yet, so this datasource stays RED/unhealthy
  # in local Grafana until s-34 provisions Tempo (or repoints traces to an
  # available datasource). Prometheus remains the default/working datasource.
  - name: OpenTelemetry (Tempo)
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToMetrics:
        datasourceUid: 'prometheus'
        tags: [{ key: 'service.name', value: 'service' }, { key: 'job' }]
        queries:
          - name: 'HTTP Latency (p99)'
            query: 'histogram_quantile(0.99, sum(rate(http_request_duration_ms_bucket[1m])) by (le))'
    editable: false
