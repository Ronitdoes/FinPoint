# ==============================================================================
# AI Revenue Recovery — Local Infrastructure (step s-02 / s-07)
#
# Brings up the full local dependency stack:
#   postgres / redis / temporal / temporal-ui / redpanda / redpanda-console / backend / frontend
#
# IMPORTANT — DEV-ONLY DEFAULTS:
#   Credentials in this file (postgres/postgres, no auth on Redis) exist purely
#   for local development. PRODUCTION MUST SOURCE ALL CREDENTIALS FROM A SECRET
#   MANAGER; never reuse these values outside your machine.
#
# All services use `restart: unless-stopped` so the stack survives Docker
# Desktop restarts during development (`infra:down` removes it explicitly).
#
# Usage:
#   bun run infra:up     # docker compose -f infra/docker/docker-compose.yml up -d
#   bun run infra:down   # ... down
#
# Temporal notes:
#   - `temporalio/auto-setup` creates its own schemas in dedicated databases
#     (`temporal`, `temporal_visibility`) inside the composed Postgres, keeping
#     application data (`revenue_recovery`) separate from workflow persistence.
#   - Namespace `revenue-recovery` is auto-created at boot via
#     ENABLE_NAMESPACE_CREATE + DEFAULT_NAMESPACE (see temporal service env).
#   - Dynamic config mounted from infra/temporal/dynamicconfig.yaml.
#
# Redpanda notes:
#   - Dual listeners: `internal://redpanda:29092` for containers (console),
#     `external://localhost:9092` for host processes (apps/services).
#   - redpanda-console is NOT in spec 01 §4; added in s-02 purely for developer
#     visibility into topics/DLQ (s-11/s-31 testing). Cheap, local-only,
#     removable without affecting the platform.
#
# Profiles (s-33 — finalized vs production assumptions in docs/deploy/):
#   - default (dev): postgres, redis, temporal, temporal-ui, redpanda,
#     redpanda-console, otel-collector, backend (api mode), frontend.
#   - `worker`: adds the `worker` service below — the SAME production image as
#     backend (`infra/docker/backend.Dockerfile`) with `command: ["worker"]`.
#     Local full loop: `docker compose --profile worker up -d --wait`.
#   - `e2e`: defined in tests/e2e/setup/compose.e2e.yml (fresh volumes,
#     MOCK_PROVIDERS=true, restart-safe worker) — never with live credentials.
# Production (docs/deploy/environments.md) does NOT use this file: managed
# Postgres (+pooler, DIRECT_URL separate), Redis, Temporal Cloud/namespace per
# env, Redpanda, API×2 behind LB, worker pool×2, frontend on Vercel.
# ==============================================================================

name: ai-revenue-recovery

services:
  postgres:
    image: postgres:16-alpine
    container_name: arr-postgres
    restart: unless-stopped
    # Local-dev capacity: vitest fans out (unit+chaos+e2e+security workers ×
    # pools per test file). Default max_connections=100 exhausts under a full
    # parallel run (PG 53300 "too many clients already"); 300 absorbs it.
    # Production uses managed Postgres with its own sizing (docs/deploy).
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres # dev-only; production uses a secret manager
      POSTGRES_DB: revenue_recovery
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d revenue_recovery"]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: arr-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 5s

  temporal:
    image: temporalio/auto-setup:1.28.0
    container_name: arr-temporal
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: postgres
      POSTGRES_PWD: postgres # dev-only; production uses a secret manager
      # Dedicated workflow-persistence databases, created by auto-setup itself:
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      # Auto-create the application namespace on first boot:
      ENABLE_NAMESPACE_CREATE: "true"
      DEFAULT_NAMESPACE: revenue-recovery
    ports:
      - "7233:7233"
    volumes:
      - ../temporal/dynamicconfig.yaml:/etc/temporal/config/dynamicconfig/docker.yaml:ro
    healthcheck:
      # The Temporal server binds its container IP (not loopback); probe that.
      test: ["CMD-SHELL", "nc -z $$(hostname -i) 7233"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

  temporal-ui:
    image: temporalio/ui:2.32.0
    container_name: arr-temporal-ui
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    healthcheck:
      # temporalio/ui ships as a static binary image; probe the HTTP endpoint
      # with whatever shell tooling the base image provides (verified in s-02).
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 10s

  redpanda:
    image: redpandadata/redpanda:v24.3.1
    container_name: arr-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --mode dev-container
      - --smp 1
      - --memory 1G
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr internal://redpanda:29092,external://localhost:9092
    ports:
      - "9092:9092"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health -X brokers=127.0.0.1:9092 | grep -Eiq 'healthy[^:]*:?\\s*true'"]
      interval: 5s
      timeout: 10s
      retries: 18
      start_period: 15s

  redpanda-console:
    image: redpandadata/console:v2.8.1
    container_name: arr-redpanda-console
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:29092
      # Serve on 8081 inside the container so it matches the published port.
      SERVER_LISTENPORT: "8081"
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8081/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 10s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    container_name: arr-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
      - "8888:8888" # Collector internal metrics
    # No container healthcheck: otel/opentelemetry-collector-contrib:0.96.0 is
    # shell-less (no sh/wget/curl/busybox), so any CMD-SHELL probe fails
    # forever and blocks `compose --wait`. Liveness is evidenced by the OTLP
    # receivers (:4317/:4318), :8888 self-metrics, and the debug exporter in
    # `docker logs arr-otel-collector`; nothing gates on this service being
    # "healthy" (backend/worker export to it fire-and-forget). If the image is
    # ever swapped for one with a shell, restore a probe against the
    # health_check extension at http://127.0.0.1:13133/.
    healthcheck:
      test: ["NONE"]

  backend:
    build:
      context: ../..
      dockerfile: infra/docker/backend.Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}
        APP_VERSION: ${APP_VERSION:-dev}
    container_name: arr-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DEPLOY_ENV: local
      PORT: "4000"
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/revenue_recovery}
      DIRECT_URL: ${DIRECT_URL:-postgres://postgres:postgres@postgres:5432/revenue_recovery}
      REDIS_URL: redis://redis:6379
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: revenue-recovery
      TEMPORAL_TASK_QUEUE: recovery-main
      EVENT_BUS_DRIVER: inprocess
      MOCK_PROVIDERS: "true"
      LOG_LEVEL: info
      PUSHGATEWAY_URL: http://pushgateway:9091
      MONITORING_COHORT: local
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001"
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:4000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 10s

  frontend:
    build:
      context: ../..
      dockerfile: infra/docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    container_name: arr-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 10s

  # Temporal worker — SAME production image as `backend`, worker entry mode
  # (s-33: identical image for API & worker). Opt-in via `--profile worker`
  # so the default `bun run infra:up` stays lean; e2e enables its own worker
  # override in tests/e2e/setup/compose.e2e.yml.
  # Healthcheck is intentionally DISABLED here: workers expose no HTTP port
  # (the image HEALTHCHECK targets GET /health in api mode). Supervision is
  # via Temporal UI (:8080), GET /metrics on the API, and cron logs.
  worker:
    build:
      context: ../..
      dockerfile: infra/docker/backend.Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}
        APP_VERSION: ${APP_VERSION:-dev}
    container_name: arr-worker
    profiles: ["worker"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
    command: ["worker"]
    healthcheck:
      test: ["NONE"]
    environment:
      NODE_ENV: production
      DEPLOY_ENV: local
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/revenue_recovery}
      DIRECT_URL: ${DIRECT_URL:-postgres://postgres:postgres@postgres:5432/revenue_recovery}
      REDIS_URL: redis://redis:6379
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: revenue-recovery
      TEMPORAL_TASK_QUEUE: recovery-main
      EVENT_BUS_DRIVER: inprocess
      MOCK_PROVIDERS: "true"
      CRON_ENABLED: "true"
      LOG_LEVEL: info
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318

  # ---- s-34 observability: Prometheus + Grafana + pushgateway + alertmanager + Loki
  # Dashboards live as code in infra/grafana/dashboards/ (provisioned via
  # infra/grafana/provisioning/). Rules in infra/prometheus/rules.yml; every
  # alert names its runbook in docs/runbooks/. Grafana anonymous view is
  # DISABLED (s-34 §Security); local dev credentials below are dev-only and
  # MUST come from the secret manager in staging+prod.
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: arr-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 10s

  pushgateway:
    image: prom/pushgateway:v1.9.0
    container_name: arr-pushgateway
    restart: unless-stopped
    ports:
      - "9091:9091"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9091/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 10s

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: arr-alertmanager
    restart: unless-stopped
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    volumes:
      - ../prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9093/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 10s

  grafana:
    image: grafana/grafana:11.1.0
    container_name: arr-grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin # dev-only; staging+prod via secret manager
      GF_SECURITY_ADMIN_PASSWORD: admin # dev-only; staging+prod via secret manager
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/executive.json
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 15s

  loki:
    image: grafana/loki:3.0.0
    container_name: arr-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ../loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 10s

  # Host/container/DB/Redis exporters feeding the node/redis/postgres scrape
  # jobs in infra/prometheus/prometheus.yml. No healthchecks: these minimal
  # images ship no shell for probe commands, and compose --wait treats
  # healthcheck-less services as ready once started.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: arr-node-exporter
    restart: unless-stopped
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "9100:9100"

  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0
    container_name: arr-redis-exporter
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - "9121:9121"

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: arr-postgres-exporter
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_NAME: postgresql://postgres:postgres@postgres:5432/revenue_recovery?sslmode=disable # dev-only
    ports:
      - "9187:9187"

volumes:
  postgres-data:
  redis-data:
  redpanda-data:
  prometheus-data:
  grafana-data:
  loki-data:
