<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Your cart is waiting</title>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.6; color: #1f2937; margin: 0; padding: 24px;">
  <div style="max-width: 600px; margin: 0 auto; background: #ffffff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 32px;">
    <h2 style="color: #111827; margin-top: 0;">Items waiting in your cart</h2>
    <p>Hi {{customer_name}},</p>
    <p>You left <strong>{{item_count}} items</strong> worth <strong>{{currency}} {{total_amount}}</strong> in your shopping cart.</p>
    <p>Use special code <strong>{{discount_code}}</strong> at checkout to complete your order today!</p>
    <div style="margin: 32px 0; text-align: center;">
      <a href="{{checkout_url}}" style="background-color: #059669; color: #ffffff; padding: 12px 24px; text-decoration: none; border-radius: 6px; font-weight: 600; display: inline-block;">Return to Checkout</a>
    </div>
    <p style="font-size: 13px; color: #6b7280; border-top: 1px solid #e5e7eb; padding-top: 16px; margin-top: 32px;">
      Questions? Reach out to our customer support team anytime.
    </p>
  </div>
</body>
</html>
