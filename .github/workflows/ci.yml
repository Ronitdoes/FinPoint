# ==============================================================================
# AI Revenue Recovery — CI pipeline (s-33).
#
# Stage order (spec 01 §26 + s-33 §Requirements 3):
#   lint + check-types (parallel) → unit → integration (compose
#   services) → security (sweep + probes) → build (images) → migrate:check
#   (ephemeral pg, incl. bad-state rejection proof) → e2e (full profile) →
#   publish (sha + semver tags) → deploy-staging (manual approval via the
#   `staging` environment) → smoke (staging journey-lite).
#
# Isolation note (learned the hard way, s-33): every job gets FRESH
# postgres/redis service containers. Sharing Redis across suites trips the
# s-30 signature-abuse IP block (10 failures/10min → 429 IP_BLOCKED) and
# turns green suites red. Never cache or share service data between jobs.
#
# Registry auth uses GITHUB_TOKEN (no long-lived keys). Cloud deploys use
# OIDC-scoped credentials — see docs/deploy/environments.md.
# ==============================================================================

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/frontend

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - run: bun install --frozen-lockfile
      - run: bun run lint

  check-types:
    name: check-types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - run: bun install --frozen-lockfile
      - run: bun run check-types

  unit:
    name: unit (infra-free)
    runs-on: ubuntu-latest
    needs: [lint, check-types]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - run: bun install --frozen-lockfile
      # Pure suites only: domain, policy, config, observability, eval
      # harness, frontend. Anything touching postgres/redis/temporal lives
      # in the integration job below.
      # NOTE: no `--` separator before the path filters — bunx swallows
      # everything after `--`, which silently disables filtering and runs
      # the whole (infra-dependent) unit project. Filters must be direct args.
      - run: >-
          bunx vitest run --project unit
          packages/domain packages/policy packages/config
          packages/observability services/eval apps/frontend

  integration:
    name: integration (compose services)
    runs-on: ubuntu-latest
    needs: [unit]
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/revenue_recovery
      DIRECT_URL: postgres://postgres:postgres@localhost:5432/revenue_recovery
      REDIS_URL: redis://localhost:6379
      TEMPORAL_ADDRESS: localhost:7233
      TEMPORAL_NAMESPACE: revenue-recovery
      EVENT_BUS_DRIVER: inprocess
      MOCK_PROVIDERS: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - run: bun install --frozen-lockfile
      - name: Bring up dependency services
        run: docker compose -f infra/docker/docker-compose.yml up -d postgres redis temporal redpanda --wait
      - run: bun run db:migrate
      - name: Audit coverage check (s-25 verifyAuditCoverage on fresh DB)
        run: bun run audit:coverage
      - run: bunx vitest run --project unit
      - name: Dump service logs on failure
        if: failure()
        run: docker compose -f infra/docker/docker-compose.yml logs --tail=200 postgres redis temporal redpanda
      - name: Tear down services
        if: always()
        run: docker compose -f infra/docker/docker-compose.yml down -v

  security:
    name: security (sweep + probes)
    runs-on: ubuntu-latest
    needs: [integration]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: revenue_recovery
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d revenue_recovery"
          --health-interval 5s --health-timeout 5s --health-retries 18
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping | grep -q PONG"
          --health-interval 5s --health-timeout 5s --health-retries 18
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/revenue_recovery
      DIRECT_URL: postgres://postgres:postgres@localhost:5432/revenue_recovery
      REDIS_URL: redis://localhost:6379
      TEMPORAL_ADDRESS: localhost:7233
      TEMPORAL_NAMESPACE: revenue-recovery
      EVENT_BUS_DRIVER: inprocess
      MOCK_PROVIDERS: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - run: bun install --frozen-lockfile
      - run: bun run db:migrate
      - run: bun run security:sweep
      - run: bun run security:audit
      - run: bun run test:security

  build:
    name: build (images)
    runs-on: ubuntu-latest
    needs: [security]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - run: bun install --frozen-lockfile
      - uses: docker/setup-buildx-action@v4
      - name: Build backend image (unified API + worker)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/backend.Dockerfile
          push: false
          load: true
          tags: arr-backend:ci
          build-args: |
            GIT_SHA=${{ github.sha }}
            APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/frontend.Dockerfile
          push: false
          load: true
          tags: arr-frontend:ci
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:4000
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image hygiene gate
        run: bun scripts/deploy-check.mjs
      - name: Monitoring-as-code gate (s-34 alert/dashboard/label audit)
        run: bun scripts/monitoring-check.mjs
      - name: Image smoke — fail LOUDLY on minimal env
        # Proof of the s-33 contract: with (almost) no env, the entrypoint
        # must exit non-zero LISTING the missing keys, not boot half-dead.
        run: |
          set +e
          OUT_API=$(docker run --rm arr-backend:ci api 2>&1)
          CODE_API=$?
          OUT_WORKER=$(docker run --rm arr-backend:ci worker 2>&1)
          CODE_WORKER=$?
          set -e
          echo "$OUT_API"
          echo "$OUT_WORKER"
          test $CODE_API -ne 0 || (echo "image-smoke: api booted without config" && exit 1)
          test $CODE_WORKER -ne 0 || (echo "image-smoke: worker booted without config" && exit 1)
          echo "$OUT_API" | grep -q "FATAL: missing required config:" || (echo "image-smoke: api did not list missing keys" && exit 1)
          echo "$OUT_API" | grep -q "DATABASE_URL" || (echo "image-smoke: DATABASE_URL not listed" && exit 1)
          echo "image-smoke: PASS (api + worker fail loud on minimal env)"

  migrate-check:
    name: migrate:check (ephemeral pg)
    runs-on: ubuntu-latest
    needs: [build]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: migrate_check
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d migrate_check"
          --health-interval 5s --health-timeout 5s --health-retries 18
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/migrate_check
      DIRECT_URL: postgres://postgres:postgres@localhost:5432/migrate_check
      REDIS_URL: redis://localhost:6379
      TEMPORAL_ADDRESS: localhost:7233
      TEMPORAL_NAMESPACE: revenue-recovery
      EVENT_BUS_DRIVER: inprocess
      MOCK_PROVIDERS: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - run: bun install --frozen-lockfile
      - name: Gate proof — check FAILS on an unmigrated database
        # Bad-state rejection evidence: migrate:check must refuse a DB that
        # has not run migrations, otherwise the gate is decorative.
        run: |
          set +e
          bun run db:migrate:check
          CODE=$?
          set -e
          test $CODE -ne 0 || (echo "migrate:check passed on empty DB — gate is broken" && exit 1)
          echo "migrate:check correctly rejected the unmigrated database"
      - name: Apply migrations, then check passes
        run: |
          bun run db:migrate
          bun run db:migrate:check

  e2e:
    name: e2e (full profile)
    runs-on: ubuntu-latest
    needs: [migrate-check]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: revenue_recovery
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d revenue_recovery"
          --health-interval 5s --health-timeout 5s --health-retries 18
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping | grep -q PONG"
          --health-interval 5s --health-timeout 5s --health-retries 18
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/revenue_recovery
      DIRECT_URL: postgres://postgres:postgres@localhost:5432/revenue_recovery
      REDIS_URL: redis://localhost:6379
      TEMPORAL_ADDRESS: localhost:7233
      TEMPORAL_NAMESPACE: revenue-recovery
      EVENT_BUS_DRIVER: inprocess
      MOCK_PROVIDERS: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - run: bun install --frozen-lockfile
      - run: bun run db:migrate
      - run: bun run test:e2e
      - run: bun run test:e2e:coverage

  publish:
    name: publish images (sha + semver)
    runs-on: ubuntu-latest
    needs: [e2e]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: backend-meta
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/metadata-action@v6
        id: frontend-meta
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/backend.Dockerfile
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/frontend.Dockerfile
          push: true
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.STAGING_PUBLIC_API_URL }}
          cache-from: type=gha

  deploy-staging:
    name: deploy-staging (manual approval)
    needs: [publish]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    uses: ./.github/workflows/deploy-staging.yml
    with:
      image_tag: sha-${{ github.sha }}
    secrets: inherit
